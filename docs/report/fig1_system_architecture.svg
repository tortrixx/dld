<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 580" width="1100" height="580" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif">
  <defs>
    <!-- Markers -->
    <marker id="arrow-black" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1e293b"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#ef4444"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#2563eb"/>
    </marker>
    
  </defs>

  <!-- Outer Canvas Container -->
  <rect x="150" y="30" width="720" height="520" rx="10" fill="#fcfcfc" stroke="#cbd5e1" stroke-width="1.2"/>
  
  <!-- Container Tag -->
  <rect x="165" y="42" width="110" height="22" rx="4" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="0.8"/>
  <text x="220" y="57" font-size="11" font-weight="600" fill="#475569" text-anchor="middle">内部核心功能框图</text>

  <!-- Top Inputs (Left Outside) -->
  <text x="50" y="86" font-size="13" font-weight="bold" fill="#0f172a">SW7 系统开关</text>
  <line x1="140" y1="82" x2="480" y2="82" stroke="#1e293b" stroke-width="1.3" marker-end="url(#arrow-black)"/>
  <text x="280" y="75" font-size="11" font-family="monospace" fill="#475569" text-anchor="middle">sw7</text>

  <text x="50" y="118" font-size="13" font-weight="bold" fill="#0f172a">BTN 复位键</text>
  <line x1="140" y1="114" x2="480" y2="114" stroke="#1e293b" stroke-width="1.3" marker-end="url(#arrow-black)"/>
  <text x="280" y="108" font-size="11" font-family="monospace" fill="#475569" text-anchor="middle">btn</text>

  <!-- Clock Capsule -->
  <rect x="480" y="70" width="85" height="54" rx="27" fill="#ef4444" stroke="#dc2626" stroke-width="1.5"/>
  <text x="522" y="93" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">时钟</text>
  <text x="522" y="110" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">50MHz</text>

  <!-- Clock Bus Line (Red Dashed) -->
  <path d="M 522 124 L 522 165" stroke="#ef4444" stroke-width="1.4" stroke-dasharray="4,4"/>
  <!-- Horizontal distribution bus -->
  <path d="M 230 165 L 860 165" stroke="#ef4444" stroke-width="1.4" stroke-dasharray="4,4"/>
  <!-- Bus label -->
  <text x="610" y="155" font-size="11.5" font-weight="600" fill="#2563eb" text-anchor="middle">rst + tick_8k / 1k / 100 / 2hz / 1hz</text>

  <!-- Clock drops down to modules -->
  <!-- drop to 键盘输入 -->
  <path d="M 230 165 L 230 230" stroke="#ef4444" stroke-width="1.4" stroke-dasharray="4,4" marker-end="url(#arrow-red)"/>
  <!-- drop to 游戏控制 -->
  <path d="M 405 165 L 405 230" stroke="#ef4444" stroke-width="1.4" stroke-dasharray="4,4" marker-end="url(#arrow-red)"/>
  <!-- drop to 拼图核心 -->
  <path d="M 605 165 L 605 230" stroke="#ef4444" stroke-width="1.4" stroke-dasharray="4,4" marker-end="url(#arrow-red)"/>
  <!-- drop to 显示子系统 -->
  <path d="M 770 165 L 770 230" stroke="#ef4444" stroke-width="1.4" stroke-dasharray="4,4" marker-end="url(#arrow-red)"/>
  <!-- drop to 音效输出 -->
  <path d="M 860 165 L 860 480 L 805 480" stroke="#ef4444" stroke-width="1.4" stroke-dasharray="4,4" marker-end="url(#arrow-red)"/>

  <!-- Left Input: 4*4 矩阵键盘 -->
  <circle cx="55" cy="265" r="38" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="55" y="270" font-size="12" font-weight="bold" fill="#0f172a" text-anchor="middle">4*4 矩阵键盘</text>

  <line x1="93" y1="250" x2="168" y2="250" stroke="#1e293b" stroke-width="1.3" marker-end="url(#arrow-black)"/>
  <text x="130" y="244" font-size="10.5" font-family="monospace" fill="#334155" text-anchor="middle">kp_row</text>

  <line x1="168" y1="280" x2="95" y2="280" stroke="#1e293b" stroke-width="1.3" marker-end="url(#arrow-black)"/>
  <text x="130" y="293" font-size="10.5" font-family="monospace" fill="#334155" text-anchor="middle">kp_col</text>

  <!-- Module 1: 键盘输入 -->
  <rect x="170" y="230" width="120" height="70" rx="8" fill="#f3e8ff" stroke="#a855f7" stroke-width="1.6"/>
  <text x="230" y="258" font-size="13.5" font-weight="bold" fill="#6b21a8" text-anchor="middle">键盘输入</text>
  <text x="230" y="278" font-size="10" fill="#7e22ce" text-anchor="middle">tick_1k + 40ms 防抖</text>

  <!-- Arrow to 游戏控制 -->
  <line x1="290" y1="265" x2="350" y2="265" stroke="#1e293b" stroke-width="1.3" marker-end="url(#arrow-black)"/>
  <text x="320" y="258" font-size="10.5" font-family="monospace" fill="#334155" text-anchor="middle">key_press</text>

  <!-- Module 2: 游戏控制 -->
  <rect x="352" y="230" width="125" height="70" rx="8" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.6"/>
  <text x="414" y="258" font-size="13.5" font-weight="bold" fill="#0369a1" text-anchor="middle">游戏控制</text>
  <text x="414" y="278" font-size="10" fill="#0284c7" text-anchor="middle">状态机、倒计时、关卡</text>

  <!-- Forward Control Arrow to 拼图核心 -->
  <line x1="477" y1="250" x2="548" y2="250" stroke="#1e293b" stroke-width="1.3" marker-end="url(#arrow-black)"/>
  <text x="512" y="240" font-size="10" font-weight="bold" fill="#334155" text-anchor="middle">控制</text>
  <text x="512" y="253" font-size="9" font-family="monospace" fill="#64748b" text-anchor="middle">round_start</text>

  <!-- Feedback Arrow from 拼图核心 to 游戏控制 (Dashed) -->
  <line x1="550" y1="280" x2="480" y2="280" stroke="#1e293b" stroke-width="1.3" stroke-dasharray="3,3" marker-end="url(#arrow-black)"/>
  <text x="512" y="293" font-size="9.5" font-weight="500" fill="#1e293b" text-anchor="middle">反馈游戏是否结束</text>

  <!-- Module 3: 拼图核心 -->
  <rect x="550" y="230" width="130" height="70" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/>
  <text x="615" y="258" font-size="13.5" font-weight="bold" fill="#15803d" text-anchor="middle">拼图核心</text>
  <text x="615" y="278" font-size="10" fill="#16a34a" text-anchor="middle">锚点、钳位、锁定、判定</text>

  <!-- Arrow to 显示子系统 -->
  <line x1="680" y1="265" x2="738" y2="265" stroke="#1e293b" stroke-width="1.3" marker-end="url(#arrow-black)"/>
  <text x="710" y="248" font-size="9" font-family="monospace" fill="#334155" text-anchor="middle">px_red[63:0]</text>
  <text x="710" y="260" font-size="9" font-family="monospace" fill="#334155" text-anchor="middle">px_green[63:0]</text>

  <!-- Module 4: 显示子系统 -->
  <rect x="740" y="230" width="125" height="70" rx="8" fill="#f3e8ff" stroke="#a855f7" stroke-width="1.6"/>
  <text x="802" y="258" font-size="13.5" font-weight="bold" fill="#6b21a8" text-anchor="middle">显示子系统</text>
  <text x="802" y="278" font-size="10" fill="#7e22ce" text-anchor="middle">tick_1k、消隐</text>

  <!-- Arrow to Outputs on Right -->
  <line x1="865" y1="265" x2="940" y2="265" stroke="#1e293b" stroke-width="1.4" marker-end="url(#arrow-black)"/>
  <text x="895" y="230" font-size="9.5" font-family="monospace" fill="#334155">seg[7:0]</text>
  <text x="895" y="242" font-size="9.5" font-family="monospace" fill="#334155">cat[7:0]</text>
  <text x="880" y="254" font-size="9.5" font-family="monospace" fill="#334155">dot_row, dot_colr,</text>
  <text x="900" y="266" font-size="9.5" font-family="monospace" fill="#334155">dot_colg</text>

  <text x="948" y="270" font-size="13.5" font-weight="bold" fill="#0f172a">数码管、8*8 双色点阵</text>

  <!-- Module 5: 图案与随机数据 (Bottom Center) -->
  <rect x="550" y="375" width="130" height="65" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/>
  <text x="615" y="405" font-size="13" font-weight="bold" fill="#15803d" text-anchor="middle">图案与随机数据</text>
  <text x="615" y="423" font-size="10" fill="#16a34a" text-anchor="middle">ROM 固化、LFSR 伪随机</text>

  <!-- Arrow from 游戏控制 down to 图案与随机数据 -->
  <path d="M 440 300 L 440 405 L 548 405" fill="none" stroke="#1e293b" stroke-width="1.3" marker-end="url(#arrow-black)"/>
  <text x="475" y="398" font-size="10" font-family="monospace" fill="#334155">state, level</text>

  <!-- Arrow from 图案与随机数据 up to 拼图核心 -->
  <line x1="615" y1="375" x2="615" y2="303" stroke="#1e293b" stroke-width="1.3" marker-end="url(#arrow-black)"/>
  <text x="620" y="325" font-size="8.5" font-family="monospace" fill="#334155">rnd_step</text>
  <text x="620" y="337" font-size="8.5" font-family="monospace" fill="#334155">target_mask[63:0]</text>
  <text x="620" y="349" font-size="8.5" font-family="monospace" fill="#334155">sel_mask</text>
  <text x="620" y="361" font-size="8.5" font-family="monospace" fill="#334155">height, width</text>

  <!-- Arrow from 图案与随机数据 to 显示子系统 -->
  <path d="M 680 410 L 775 410 L 775 303" fill="none" stroke="#1e293b" stroke-width="1.3" marker-end="url(#arrow-black)"/>
  <text x="735" y="402" font-size="9" font-family="monospace" fill="#334155">pattern_mask[63:0]</text>

  <!-- Arrow from 游戏控制 down to 显示子系统 (Count BCD, blink) -->
  <path d="M 405 300 L 405 345 L 755 345 L 755 303" fill="none" stroke="#1e293b" stroke-width="1.3" marker-end="url(#arrow-black)"/>
  <text x="490" y="340" font-size="9" font-family="monospace" fill="#334155">game_cnt_bcd, blink</text>

  <!-- Module 6: 音效输出 (Bottom Right) -->
  <rect x="690" y="455" width="115" height="55" rx="8" fill="#f3e8ff" stroke="#a855f7" stroke-width="1.6"/>
  <text x="747" y="480" font-size="13" font-weight="bold" fill="#6b21a8" text-anchor="middle">音效输出</text>
  <text x="747" y="497" font-size="10" fill="#7e22ce" text-anchor="middle">tick_8k、8种音效</text>

  <!-- Arrow from 游戏控制 down to 音效输出 (Sound Code) -->
  <path d="M 375 300 L 375 480 L 687 480" fill="none" stroke="#1e293b" stroke-width="1.3" marker-end="url(#arrow-black)"/>
  <text x="440" y="475" font-size="10" font-family="monospace" fill="#334155">sound_code</text>

  <!-- Arrow from 音效输出 to 蜂鸣器 -->
  <line x1="805" y1="482" x2="880" y2="482" stroke="#1e293b" stroke-width="1.4" marker-end="url(#arrow-black)"/>
  <text x="835" y="476" font-size="10" font-family="monospace" fill="#334155">buzz</text>
  <text x="888" y="486" font-size="13.5" font-weight="bold" fill="#0f172a">蜂鸣器</text>

</svg>