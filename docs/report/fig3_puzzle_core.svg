<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 400" width="950" height="400" font-family="Hiragino Sans GB, PingFang SC, Noto Sans SC, Microsoft YaHei, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1e293b"/>
    </marker>
    
  </defs>

  <rect width="950" height="400" fill="#ffffff"/>

  <!-- Step 1: LFSR 随机散落与锚点寄存器 -->
  <rect x="40" y="60" width="180" height="110" rx="8" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.8"/>
  <text x="130" y="92" font-size="13" font-weight="bold" fill="#15803d" text-anchor="middle">1. 随机散落与锚点生成</text>
  <text x="130" y="115" font-size="10" fill="#16a34a" text-anchor="middle">16位本原多项式 LFSR</text>
  <text x="130" y="132" font-size="10" fill="#16a34a" text-anchor="middle">动态采样生成初始 (dx, dy)</text>
  <text x="130" y="149" font-size="9.5" fill="#15803d" text-anchor="middle">即时互检杜绝零片重叠</text>

  <!-- Arrow Step 1 -> Step 2 -->
  <line x1="220" y1="115" x2="275" y2="115" stroke="#1e293b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="248" y="105" font-size="9.5" font-family="monospace" fill="#475569" text-anchor="middle">(x_pos, y_pos)</text>

  <!-- Step 2: 64位几何平移与旋转 -->
  <rect x="280" y="60" width="190" height="110" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.8"/>
  <text x="375" y="92" font-size="13" font-weight="bold" fill="#1d4ed8" text-anchor="middle">2. 64位几何变换处理器</text>
  <text x="375" y="115" font-size="10" fill="#2563eb" text-anchor="middle">零片 ROM 原型掩码输入</text>
  <text x="375" y="132" font-size="10" fill="#2563eb" text-anchor="middle">纯组合移位器执行二维平移</text>
  <text x="375" y="149" font-size="9.5" fill="#1d4ed8" text-anchor="middle">S3 触发 90° 原位顺时针旋转</text>

  <!-- Arrow Step 2 -> Step 3 -->
  <line x1="470" y1="115" x2="525" y2="115" stroke="#1e293b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="498" y="105" font-size="9.5" font-family="monospace" fill="#475569" text-anchor="middle">piece_new</text>

  <!-- Step 3: 刚性碰撞与越界拦截 -->
  <rect x="530" y="60" width="180" height="110" rx="8" fill="#fef2f2" stroke="#ef4444" stroke-width="1.8"/>
  <text x="620" y="92" font-size="13" font-weight="bold" fill="#b91c1c" text-anchor="middle">3. 刚性碰撞拦截检测</text>
  <text x="620" y="115" font-size="10" fill="#dc2626" text-anchor="middle">越界检测: x&lt;0 | x+w&gt;8 ...</text>
  <text x="620" y="132" font-size="10" fill="#dc2626" text-anchor="middle">重叠检测: piece AND locked</text>
  <text x="620" y="149" font-size="9.5" font-weight="bold" fill="#b91c1c" text-anchor="middle">冲突单拍锁死禁止更新</text>

  <!-- Arrow Step 3 -> Step 4 -->
  <line x1="710" y1="115" x2="755" y2="115" stroke="#1e293b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="733" y="105" font-size="9.5" font-family="monospace" fill="#475569" text-anchor="middle">合法更新</text>

  <!-- Step 4: 锁定并集与全图比对 -->
  <rect x="760" y="60" width="165" height="110" rx="8" fill="#faf5ff" stroke="#a855f7" stroke-width="1.8"/>
  <text x="842" y="92" font-size="13" font-weight="bold" fill="#6b21a8" text-anchor="middle">4. 锁定与全图验证</text>
  <text x="842" y="115" font-size="10" fill="#7e22ce" text-anchor="middle">S8 确认: piece 并入锁定面</text>
  <text x="842" y="132" font-size="10" fill="#7e22ce" text-anchor="middle">全图比对: locked == target</text>
  <text x="842" y="149" font-size="9.5" font-weight="bold" fill="#15803d" text-anchor="middle">100% 吻合即置高 match</text>

  <!-- Bottom: 64位双平面帧缓冲与行切片输出 -->
  <rect x="180" y="240" width="600" height="110" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
  <text x="480" y="268" font-size="13.5" font-weight="bold" fill="#0f172a" text-anchor="middle">双平面 64位 像素合成与 125 Hz 超临界行扫描消隐</text>
  <line x1="200" y1="280" x2="760" y2="280" stroke="#cbd5e1" stroke-width="1"/>

  <text x="280" y="305" font-size="11" font-weight="bold" fill="#dc2626">红光平面 (Red Plane)</text>
  <text x="280" y="325" font-size="10" fill="#475569">游离未选零片 + 锁定零片红分量</text>

  <text x="480" y="305" font-size="11" font-weight="bold" fill="#16a34a">绿光平面 (Green Plane)</text>
  <text x="480" y="325" font-size="10" fill="#475569">当前选中零片 + ≤10s 幽灵闪烁辅助</text>

  <text x="680" y="305" font-size="11" font-weight="bold" fill="#ca8a04">黄光合成 (Yellow)</text>
  <text x="680" y="325" font-size="10" fill="#475569">已正确锁定的零片 (红+绿双亮)</text>

  <!-- Connect Step 4 & Display Buffer -->
  <path d="M 842 170 L 842 295 L 782 295" fill="none" stroke="#1e293b" stroke-width="1.4" marker-end="url(#arrow)"/>
  <path d="M 375 170 L 375 238" fill="none" stroke="#1e293b" stroke-width="1.4" marker-end="url(#arrow)"/>

</svg>