<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>简易拼图游戏 · 大模块设计与答辩速查</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="description" content="简易拼图游戏 CPLD 硬件设计：六大模块的原理、仿真波形读图要点与答辩问答速查">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  <meta name="theme-color" content="#0f766e">

  <!-- Docsify 基础主题（版本固定，避免上游更新把站点改坏） -->
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@4.13.1/lib/themes/vue.css">

  <!-- 站点自定义样式（最后加载，覆盖主题默认值） -->
  <link rel="stylesheet" href="assets/custom.css">
</head>
<body>
  <div id="app">正在加载文档…</div>

  <script>
    window.$docsify = {
      name: '简易拼图游戏',
      themeColor: '#0f766e',

      loadSidebar: true,
      subMaxLevel: 2,          // 侧边栏只展开到二级标题，避免目录过长
      auto2top: true,
      homepage: 'README.md',
      notFoundPage: true,
      maxLevel: 4,

      search: {
        maxAge: 86400000,
        paths: 'auto',
        placeholder: '搜索模块、信号、波形、答辩问题…',
        noData: '没有找到相关内容',
        depth: 3,
        hideOtherSidebarContent: false
      },

      copyCode: {
        buttonText: '复制',
        errorText: '复制失败',
        successText: '已复制'
      },

      pagination: {
        previousText: '上一个模块',
        nextText: '下一个模块',
        crossChapter: true,
        crossChapterText: true
      }
    }
  </script>

  <!-- 行为增强：把「图片 + 斜体图注」包成 figure（必须在 docsify 之前加载） -->
  <script src="assets/custom.js"></script>

  <!-- Docsify 核心与官方插件 -->
  <script src="//cdn.jsdelivr.net/npm/docsify@4.13.1/lib/docsify.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify@4.13.1/lib/plugins/search.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify@4.13.1/lib/plugins/zoom-image.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify-copy-code@2.1.1/dist/docsify-copy-code.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify-pagination@2.10.1/dist/docsify-pagination.min.js"></script>

  <!-- Prism 代码高亮：VHDL 不在默认语言包里，需要单独补 -->
  <script src="//cdn.jsdelivr.net/npm/prismjs@1.29.0/components/prism-vhdl.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1.29.0/components/prism-python.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1.29.0/components/prism-bash.min.js"></script>
</body>
</html>
