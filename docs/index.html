<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>简易拼图游戏 · 硬件子系统设计与答辩速查</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="description" content="简易拼图游戏 VHDL 核心大模块硬件设计、时序仿真波形深度分析与答辩速查">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  
  <!-- Docsify Vue 基础主题 -->
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">
  
  <!-- KaTeX 数学公式渲染 CSS -->
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/katex@latest/dist/katex.min.css"/>
  
  <!-- 极简清新绿色自定义样式 -->
  <link rel="stylesheet" href="assets/custom.css">
</head>
<body>
  <div id="app">正在加载文档，请稍候...</div>
  
  <script>
    window.$docsify = {
      name: '简易拼图游戏 (DLD)',
      themeColor: '#059669',
      loadSidebar: true,
      subMaxLevel: 3,
      loadNavbar: false,      // 关闭顶部导航，突出专注度
      coverpage: false,       // 关闭封面，直入主题
      auto2top: true,
      homepage: 'README.md',
      notFoundPage: true,
      
      // 全文搜索配置（无 Emoji）
      search: {
        maxAge: 86400000,
        paths: 'auto',
        placeholder: '搜索大模块、信号、仿真波形、答辩考点...',
        noData: '未找到相关内容',
        depth: 4,
        hideOtherSidebarContent: false
      },
      
      // 代码复制插件
      copyCode: {
        buttonText: '复制',
        errorText: '错误',
        successText: '已复制'
      },
      
      // 翻页导航配置
      pagination: {
        previousText: '上一大模块',
        nextText: '下一大模块',
        crossChapter: true,
        crossChapterText: true
      },
      
      // 仿真波形与图片点击缩放插件
      zoomImage: {
        selector: '.content img',
        options: {
          background: 'rgba(6, 78, 59, 0.85)',
          scrollOffset: 40
        }
      }
    }
  </script>
  
  <!-- Docsify 核心库与插件 -->
  <script src="//cdn.jsdelivr.net/npm/docsify@4/lib/docsify.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify@4/lib/plugins/search.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify-copy-code/dist/docsify-copy-code.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify/lib/plugins/zoom-image.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify-pagination/dist/docsify-pagination.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify-sidebar-collapse/dist/docsify-sidebar-collapse.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify-katex@latest/dist/docsify-katex.js"></script>
  
  <!-- Prism 代码高亮 -->
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-vhdl.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-python.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-bash.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-json.min.js"></script>
</body>
</html>
