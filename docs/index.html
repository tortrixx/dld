<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>简易拼图游戏 · 大模块设计与答辩速查</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="description" content="简易拼图游戏 CPLD 硬件设计：六大模块的原理、仿真波形读图要点与答辩问答速查">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  <meta name="theme-color" content="#0f766e">

  <!--
    依赖全部放在 assets/vendor/ 本地，不走 CDN。
    理由：答辩现场的网络未必能访问 cdn.jsdelivr.net，一旦 CDN 不可达，
    页面会永久停在「正在加载文档…」。本地副本由 scripts/vendor_assets.py 下载，
    升级版本时改那里的版本号重跑即可。
  -->
  <link rel="stylesheet" href="assets/vendor/vue.css">
  <link rel="stylesheet" href="assets/custom.css">
</head>
<body>
  <div id="app">正在加载文档…</div>

  <script>
    window.$docsify = {
      name: '简易拼图游戏',
      themeColor: '#0f766e',

      loadSidebar: true,
      subMaxLevel: 2,          // 侧边栏只展开到二级标题，避免目录过长
      auto2top: true,
      homepage: 'README.md',
      maxLevel: 4,

      search: {
        maxAge: 86400000,
        paths: 'auto',
        placeholder: '搜索模块、信号、波形、答辩问题…',
        noData: '没有找到相关内容',
        depth: 3,
        hideOtherSidebarContent: false
      },

      copyCode: {
        buttonText: '复制',
        errorText: '复制失败',
        successText: '已复制'
      },

      pagination: {
        previousText: '上一个模块',
        nextText: '下一个模块',
        crossChapter: true,
        crossChapterText: false   // 章节名对本站无信息量（各页同属「模块速查」），关掉免得重复一行
      }
    }
  </script>

  <!-- 行为增强：把「图片 + 斜体图注」包成 figure（必须在 docsify 之前加载） -->
  <script src="assets/custom.js"></script>

  <!-- Docsify 核心与插件（本地副本，见 scripts/vendor_assets.py） -->
  <script src="assets/vendor/docsify.min.js"></script>
  <script src="assets/vendor/search.min.js"></script>
  <script src="assets/vendor/zoom-image.min.js"></script>
  <script src="assets/vendor/docsify-copy-code.min.js"></script>
  <script src="assets/vendor/docsify-pagination.min.js"></script>

  <!-- Prism 代码高亮：VHDL 不在 docsify 自带的语言包里，需要单独补 -->
  <script src="assets/vendor/prism-vhdl.min.js"></script>

  <!--
    兜底：如果 docsify 核心脚本本身没加载成功（文件缺失、被拦截），
    把占位文案换成人能看懂的提示，而不是让页面一直停在「正在加载文档…」。
  -->
  <script>
    window.addEventListener('load', function () {
      if (window.Docsify) return;
      var app = document.getElementById('app');
      if (app) {
        app.innerHTML = '<p style="font-family:system-ui;padding:24px;line-height:1.8">' +
          '文档引擎 <code>assets/vendor/docsify.min.js</code> 没能加载。<br>' +
          '请确认这个文件存在且可访问，然后刷新页面。</p>';
      }
    });
  </script>
</body>
</html>
