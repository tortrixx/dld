<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>简易拼图游戏 · MAX II EPM1270 上的 8×8 双色点阵 | tortrixx/dld</title>
    <meta
      name="description"
      content="数字电路与逻辑设计实验（下）题目 4：在 MAX II EPM1270T144C5 上用 VHDL-93 纯 RTL 实现 8×8 双色点阵拼图游戏。含可播放的时序/数据流图、真实编译与时序数据、179 条仿真断言与硬件调试记录。"
    />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#0a0a0b" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 8 8'%3E%3Crect width='8' height='8' fill='%230a0a0b'/%3E%3Crect x='1' y='1' width='2' height='2' fill='%23ff6a45'/%3E%3Crect x='5' y='1' width='2' height='2' fill='%23ff6a45'/%3E%3Crect x='1' y='5' width='2' height='2' fill='%23ff6a45'/%3E%3Crect x='5' y='5' width='2' height='2' fill='%23ff6a45'/%3E%3C/svg%3E"
    />
    <script>
      /* 主题必须在首帧之前定下来：否则深色模式下会先闪一下白屏（FOUC）。
         规则与 ThemeToggle 一致 —— 没存过就跟随系统（不加 data-theme）。 */
      (function () {
        try {
          var t = localStorage.getItem('dld-theme');
          if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
        } catch (e) {
          /* 隐私模式：跟随系统即可 */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
