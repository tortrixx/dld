name: Deploy technical showcase to Pages
on:
  push:
    branches: [main]
    paths:
      - 'zensical-site/**'
      - 'docs/**'
      - 'rtl/**'
      - 'sim/**'
      - 'quartus/**'
      - 'facts/**'
      - 'scripts/**'
      - 'README.md'
      - 'HANDOVER.md'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
    inputs:
      renderer:
        description: 'Use docsify only to roll back the website'
        type: choice
        default: zensical
        options: [zensical, docsify]
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify fact model
        run: python scripts/extract_facts.py --check
      - name: Preserve original documentation checks
        run: python scripts/check_docs.py
      - name: Check privacy
        run: python scripts/check_privacy.py
      - name: Install pinned Zensical
        if: inputs.renderer != 'docsify'
        run: python -m pip install -r zensical-site/requirements.txt
      - name: Build curated showcase
        if: inputs.renderer != 'docsify'
        run: |
          python zensical-site/scripts/prepare.py
          cd zensical-site
          zensical build --strict
      - name: Verify rendered publication
        if: inputs.renderer != 'docsify'
        run: python zensical-site/scripts/check_site.py
      - name: Package verified Zensical site
        if: inputs.renderer != 'docsify'
        run: |
          mkdir _site
          cp -r zensical-site/site/. _site/
      - name: Package legacy site for rollback
        if: inputs.renderer == 'docsify'
        run: |
          mkdir _site
          cp -r docs/assets docs/subsystems _site/
          cp docs/index.html docs/README.md docs/_sidebar.md docs/.nojekyll _site/
          test -f _site/assets/vendor/docsify.min.js
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build-and-verify
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
