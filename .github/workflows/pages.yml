# ============================================================================
#  .github/workflows/pages.yml —— 自动化部署 Docsify 文档站到 GitHub Pages
# ----------------------------------------------------------------------------
#  线上地址：https://tortrixx.github.io/dld/
#  文档目录：docs/
#
#  设计原则：
#    · 纯静态轻量部署：Docsify 客户端实时解析 Markdown，无需沉重 Python 构建步骤
#    · 事实模型一致性校验：每次部署前通过 extract_facts.py --check 确保工程事实最新
#    · 零外部侵入：不改写硬件 RTL、仿真网表与约束
# ============================================================================

name: Deploy Docsify to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'rtl/**'
      - 'sim/**'
      - 'facts/**'
      - 'scripts/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-verify:
    name: Verify & Package Docsify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify Fact Model Consistency
        run: python scripts/extract_facts.py --check

      - name: Verify Essential Docsify Files
        run: |
          set -euo pipefail
          test -f docs/index.html || { echo "Missing docs/index.html"; exit 1; }
          test -f docs/README.md || { echo "Missing docs/README.md"; exit 1; }
          test -f docs/_sidebar.md || { echo "Missing docs/_sidebar.md"; exit 1; }
          test -f docs/.nojekyll || { echo "Missing docs/.nojekyll"; exit 1; }
          echo "All core Docsify files present and verified."

      # 站点体检：链接/图片是否存在、粗体与原始 HTML 块是否会渲染失败。
      # 这三类故障都不会报错，只会在浏览器里悄悄变丑，所以必须挡在部署之前。
      - name: Check Docsify Site Integrity
        run: python scripts/check_docs.py

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    name: Deploy to GitHub Pages
    needs: build-and-verify
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
