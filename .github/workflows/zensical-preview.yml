name: Validate Zensical Showcase
on:
  pull_request:
    paths:
      - 'zensical-site/**'
      - 'docs/**'
      - 'facts/**'
      - 'rtl/**'
      - 'sim/**'
      - '.github/workflows/zensical-preview.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify engineering facts
        run: python scripts/extract_facts.py --check
      - name: Preserve legacy documentation checks
        run: python scripts/check_docs.py
      - name: Install Zensical
        run: python -m pip install 'zensical>=0.1,<0.3'
      - name: Prepare curated documentation
        run: python zensical-site/scripts/prepare.py
      - name: Build Zensical
        run: cd zensical-site && zensical build
      - uses: actions/upload-artifact@v4
        with:
          name: zensical-site-preview
          path: _zensical_output
